// =============================================================================
// route.proto  —  contract for the ROUTE SERVICE (Service B)
// -----------------------------------------------------------------------------
// The Route Service owns the "Trek Route" resource of the Druk Trek Permit
// System. A trek route (e.g. "Jomolhari Trek") is an INDEPENDENT resource:
// it exists on its own and does not depend on anything else.
//
// Other services (the Permit Service) may only read route data through this
// gRPC API — never by touching the route database directly
// (Database per Service pattern).
// =============================================================================
syntax = "proto3";

package route.v1;

option go_package = "github.com/sonamzangmo/druk-trek-permits/gen/routepb;routepb";

// RouteService exposes full CRUD for trek routes.
service RouteService {
  rpc CreateRoute(CreateRouteRequest) returns (Route);
  rpc GetRoute(GetRouteRequest) returns (Route);
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc UpdateRoute(UpdateRouteRequest) returns (Route);
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);
}

// Route is a trekking route in Bhutan that tourists need a permit for.
message Route {
  string id = 1;              // UUID generated by the database
  string name = 2;            // e.g. "Jomolhari Trek"
  string region = 3;          // dzongkhag / region, e.g. "Paro"
  string difficulty = 4;      // EASY | MODERATE | HARD
  int32 duration_days = 5;    // length of the trek in days (1..40)
  int32 max_group_size = 6;   // maximum people allowed on one permit (1..30)
  bool is_open = 7;           // false = route closed (e.g. monsoon / snow)
  string created_at = 8;      // RFC3339 timestamp
}

message CreateRouteRequest {
  string name = 1;
  string region = 2;
  string difficulty = 3;
  int32 duration_days = 4;
  int32 max_group_size = 5;
  bool is_open = 6;
}

message GetRouteRequest {
  string id = 1;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  repeated Route routes = 1;
}

// UpdateRouteRequest replaces all editable fields of a route (PUT semantics).
message UpdateRouteRequest {
  string id = 1;
  string name = 2;
  string region = 3;
  string difficulty = 4;
  int32 duration_days = 5;
  int32 max_group_size = 6;
  bool is_open = 7;
}

message DeleteRouteRequest {
  string id = 1;
}

message DeleteRouteResponse {
  string message = 1;
}
