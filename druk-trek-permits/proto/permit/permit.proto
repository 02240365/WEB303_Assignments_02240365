// =============================================================================
// permit.proto  —  contract for the PERMIT SERVICE (Service A)
// -----------------------------------------------------------------------------
// The Permit Service owns the "Trek Permit" resource. A permit DEPENDS on a
// trek route: you cannot get a permit for a route that does not exist, is
// closed, or whose group-size limit you exceed.
//
// To check those rules the Permit Service calls the Route Service over gRPC
// (protected by timeout + retry + circuit breaker).
// =============================================================================
syntax = "proto3";

package permit.v1;

option go_package = "github.com/sonamzangmo/druk-trek-permits/gen/permitpb;permitpb";

// PermitService exposes full CRUD for trek permits.
service PermitService {
  rpc CreatePermit(CreatePermitRequest) returns (Permit);
  rpc GetPermit(GetPermitRequest) returns (Permit);
  rpc ListPermits(ListPermitsRequest) returns (ListPermitsResponse);
  rpc UpdatePermit(UpdatePermitRequest) returns (Permit);
  rpc DeletePermit(DeletePermitRequest) returns (DeletePermitResponse);
}

// RouteInfo is a small copy of route data fetched LIVE from the Route Service.
// It is never stored in the permit database.
message RouteInfo {
  string name = 1;
  string region = 2;
  string difficulty = 3;
  int32 duration_days = 4;
  // available = false means the Route Service could not be reached and this
  // is a FALLBACK response (graceful degradation).
  bool available = 5;
  string note = 6;
}

// Permit is a trekking permit issued to a group leader for one route.
message Permit {
  string id = 1;               // UUID generated by the database
  string route_id = 2;         // ID of the route (owned by Route Service)
  string trekker_name = 3;     // name of the group leader
  string passport_number = 4;  // 6-9 uppercase letters / digits
  string nationality = 5;      // e.g. "Japan"
  int32 group_size = 6;        // number of trekkers in the group
  string start_date = 7;       // YYYY-MM-DD, must be today or later
  string status = 8;           // ISSUED | CANCELLED
  string created_at = 9;       // RFC3339 timestamp
  RouteInfo route = 10;        // live route details from Route Service
}

message CreatePermitRequest {
  string route_id = 1;
  string trekker_name = 2;
  string passport_number = 3;
  string nationality = 4;
  int32 group_size = 5;
  string start_date = 6;
}

message GetPermitRequest {
  string id = 1;
}

// ListPermitsRequest can optionally filter by route.
message ListPermitsRequest {
  string route_id = 1;
}

message ListPermitsResponse {
  repeated Permit permits = 1;
}

// UpdatePermitRequest replaces all editable fields of a permit (PUT semantics).
message UpdatePermitRequest {
  string id = 1;
  string route_id = 2;
  string trekker_name = 3;
  string passport_number = 4;
  string nationality = 5;
  int32 group_size = 6;
  string start_date = 7;
  string status = 8;
}

message DeletePermitRequest {
  string id = 1;
}

message DeletePermitResponse {
  string message = 1;
}
